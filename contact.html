<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Services | Contact</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JS -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <h1 class="logo">ProServe</h1>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <div class="container">
            <h2>Contact Us</h2>
            <p>We'd love to hear from you. Get in touch with us today.</p>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact-section">
        <div class="container">

            <div class="contact-wrapper">

                <!-- CONTACT INFO -->
                <div class="contact-info">
                    <h3>Our Office</h3>
                    <p>Email: contact@proserve.com</p>
                    <p>Phone: +91 98765 43210</p>
                    <p>Location: India</p>
                </div>

                <!-- CONTACT FORM -->
                <form class="contact-form" onsubmit="validateForm(event)">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name">
                        <small class="error" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                        <small class="error" id="emailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Write your message"></textarea>
                        <small class="error" id="messageError"></small>
                    </div>

                    <button type="submit" class="btn">Send Message</button>

                </form>

            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>© 2026 ProServe. All rights reserved.</p>
        </div>
    </footer>
    
</body>
</html>
